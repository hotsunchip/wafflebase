<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes sandbox — code-block styling</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #d0d7de;
        font: 14px system-ui, sans-serif;
      }
      .dark #toolbar {
        border-color: #30363d;
        background: #0d1117;
        color: #c9d1d9;
      }
      #editor {
        height: calc(100vh - 45px);
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <strong>Notes sandbox</strong>
      <button id="toggle-dark" type="button">Toggle dark</button>
      <button id="toggle-mode" type="button">Toggle view/both</button>
      <span style="opacity: 0.6"
        >No backend — in-memory store, real renderer + CSS.</span
      >
    </div>
    <div id="editor"></div>
    <script type="module" src="/src/notes-sandbox.ts"></script>
  </body>
</html>
